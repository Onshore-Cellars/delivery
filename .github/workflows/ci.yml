name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Advisory for now: the repo carries pre-existing lint debt (mostly
      # experimental React-compiler rules on legacy pages). Typecheck, tests and
      # build below are the hard gates; tighten this to blocking once the
      # backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'
